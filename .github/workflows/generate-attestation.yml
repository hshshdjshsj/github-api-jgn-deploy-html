name: Generate Backend Attestation

on:
  workflow_dispatch:
    inputs:
      backend_file:
        description: "Lokasi file backend"
        required: true
        default: "api/health.js"
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Validate files
        env:
          BACKEND_FILE: ${{ inputs.backend_file }}
        run: |
          test -f "$BACKEND_FILE" || {
            echo "ERROR: File backend tidak ditemukan: $BACKEND_FILE"
            exit 1
          }

          test -f tools/generate_backend_attestation_v230.js || {
            echo "ERROR: Generator tidak ditemukan"
            exit 1
          }

          test -f ci-report.json || {
            echo "ERROR: ci-report.json tidak ditemukan"
            exit 1
          }

          node --check "$BACKEND_FILE"

          echo "Node version:"
          node --version

          echo "Backend SHA-256:"
          sha256sum "$BACKEND_FILE"

      - name: Generate attestation
        env:
          DIRAC_BACKEND_ATTESTATION_PRIVATE_KEY_PEM: ${{ secrets.DIRAC_BACKEND_ATTESTATION_PRIVATE_KEY_PEM }}
          DIRAC_ATTEST_TARGET_FILE: ${{ inputs.backend_file }}
          DIRAC_ATTEST_CI_REPORT: ci-report.json
        run: |
          node tools/generate_backend_attestation_v230.js

      - name: Print Vercel ENV values
        run: |
          node <<'NODE'
          const fs = require('fs');

          const output = JSON.parse(
            fs.readFileSync(
              'attestation-output.json',
              'utf8'
            )
          );

          console.log('');
          console.log('===== DIRAC_BACKEND_BUILD_ATTESTATION_V230 =====');
          console.log(output.encoded);

          console.log('');
          console.log('===== DIRAC_BACKEND_BUILD_ATTESTATION_SIGNATURE_V230 =====');
          console.log(output.signature);

          console.log('');
          console.log('===== DIRAC_BACKEND_ATTESTATION_PUBLIC_KEY_PEM =====');
          console.log(output.public_key_pem);

          console.log('');
          console.log('===== BUILD SHA-256 =====');
          console.log(output.payload.build_sha256);

          console.log('');
          console.log('===== NODE VERSION =====');
          console.log(output.payload.node_version);

          console.log('');
          console.log('===== EXPIRES AT =====');
          console.log(output.payload.expires_at);
          NODE

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: dirac-backend-attestation
          path: attestation-output.json
          retention-days: 7
